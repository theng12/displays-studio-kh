<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Displays Studio KH</title>
  <link rel="stylesheet" href="panel.css">
  <script type="module" src="panel.js"></script>
</head>
<body>
  <header>
    <div><h1>Displays</h1><p>External monitor controls</p></div>
    <button type="button" id="refresh">Refresh</button>
  </header>
  <main aria-label="External monitors" id="displays"></main>
  <p id="status" role="status" aria-live="polite">Checking your displays…</p>
  <footer>
    <label><input id="shortcuts" type="checkbox" disabled> Brightness shortcuts</label>
    <p><kbd aria-label="Control Shift right bracket">⌃⇧]</kbd> brighter · <kbd aria-label="Control Shift left bracket">⌃⇧[</kbd> dimmer · all supported displays</p>
    <button class="version" type="button" id="version" title="What's New">Displays Studio KH</button>
  </footer>
  <dialog aria-labelledby="news-title" id="news">
    <h2 id="news-title">What's New <span id="news-version"></span></h2>
    <ul id="notes"></ul>
    <form method="dialog"><button autofocus>Done</button></form>
  </dialog>
</body>
</html>
