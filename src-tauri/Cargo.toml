[package]
name = "displays-studio-kh"
version = "0.1.13"
edition = "2021"
default-run = "displays-studio-kh"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core-graphics = "0.24"
ddc = "0.2"
ddc-macos = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# §5d capture: wry already carries these, so the versions match the lock; a direct entry is what Rust
# needs before the app's own code may use them.
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", features = ["NSAppearance", "NSImage", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", features = ["NSDate", "NSRunLoop", "NSString", "NSValue"] }
objc2-web-kit = { version = "=0.3.2", features = ["WKWebView", "WKSnapshotConfiguration", "block2"] }
block2 = "=0.6.2"

[dev-dependencies]
ddc-hi = "=0.4.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
webview-check = []

[patch.crates-io]
ddc-macos = { path = "vendor/ddc-macos" }
