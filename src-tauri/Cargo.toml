[package]
name = "displays-studio-kh"
version = "0.1.6"
edition = "2021"
default-run = "displays-studio-kh"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core-graphics = "0.24"
ddc = "0.2"
ddc-macos = "=0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
ddc-hi = "=0.4.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
webview-check = []

[patch.crates-io]
ddc-macos = { path = "vendor/ddc-macos" }
